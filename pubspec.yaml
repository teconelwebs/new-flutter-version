name: welfog
description: Welfog main Flutter app
publish_to: "none"
version: 1.1.42+78

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  welfog_flutter_play:
    path: ./flutter_play_module
  video_player: ^2.9.2
  http: ^1.2.0
  shared_preferences: ^2.3.5
  flutter_svg: ^2.3.0
  share_plus: ^10.1.4
  app_links: ^6.1.1
  flutter_widget_from_html: ^0.15.2
  webview_flutter: ^4.10.0
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  url_launcher: ^6.3.2
  mobile_scanner: ^7.2.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  package_info_plus: ^8.1.2
  speech_to_text: ^7.4.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  shimmer: ^3.0.0
  path_provider: ^2.1.6
  file: ^7.0.1
  path: ^1.9.1
  flutter_cashfree_pg_sdk: ^2.4.0+52



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
